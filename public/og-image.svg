<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#dc2626" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#dc2626" stop-opacity="1"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <!-- Sprocket hole pattern for film strips -->
    <pattern id="sprocketTop" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <rect x="10" y="8"  width="28" height="16" rx="4" fill="#0f172a"/>
      <rect x="10" y="64" width="28" height="16" rx="4" fill="#0f172a"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid overlay -->
  <rect width="1200" height="630" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Top film strip -->
  <rect x="0" y="0" width="1200" height="88" fill="#1e293b"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#sprocketTop)"/>

  <!-- Bottom film strip -->
  <rect x="0" y="542" width="1200" height="88" fill="#1e293b"/>
  <rect x="0" y="542" width="1200" height="88" fill="url(#sprocketTop)"/>

  <!-- Red accent line -->
  <rect x="0" y="338" width="1200" height="3" fill="url(#redline)"/>

  <!-- Film icon (simplified strip) -->
  <rect x="76" y="210" width="80" height="50" rx="6" fill="#1e293b" stroke="#374151" stroke-width="1.5"/>
  <rect x="80" y="215" width="10" height="8"  rx="1.5" fill="#0f172a"/>
  <rect x="80" y="227" width="10" height="8"  rx="1.5" fill="#0f172a"/>
  <rect x="80" y="239" width="10" height="8"  rx="1.5" fill="#0f172a"/>
  <rect x="146" y="215" width="10" height="8" rx="1.5" fill="#0f172a"/>
  <rect x="146" y="227" width="10" height="8" rx="1.5" fill="#0f172a"/>
  <rect x="146" y="239" width="10" height="8" rx="1.5" fill="#0f172a"/>
  <rect x="94" y="213" width="48" height="44" rx="3" fill="#dc2626"/>

  <!-- "Powered by Claude API" badge -->
  <rect x="76" y="278" width="232" height="36" rx="18" fill="#7f1d1d" fill-opacity="0.5"/>
  <rect x="76" y="278" width="232" height="36" rx="18" fill="none" stroke="#dc2626" stroke-opacity="0.4" stroke-width="1"/>
  <text x="192" y="301" text-anchor="middle" fill="#fca5a5" font-size="15" font-weight="600" letter-spacing="0.5">Powered by Claude API</text>

  <!-- Main title -->
  <text x="76" y="190" fill="white" font-size="102" font-weight="900" letter-spacing="-3">CineBrowse</text>

  <!-- Tagline -->
  <text x="76" y="390" fill="#94a3b8" font-size="34" font-weight="400">AI-powered movie recommendations</text>

  <!-- Sub-tagline -->
  <text x="76" y="442" fill="#475569" font-size="24">Tell Claude your mood — get 3 perfect films for tonight.</text>

  <!-- Right side: feature pills -->
  <rect x="820" y="220" width="300" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="970" y="247" text-anchor="middle" fill="#94a3b8" font-size="18">🤖  AI Recommendations</text>

  <rect x="820" y="278" width="300" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="970" y="305" text-anchor="middle" fill="#94a3b8" font-size="18">🎬  10,000+ Movies</text>

  <rect x="820" y="336" width="300" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="970" y="363" text-anchor="middle" fill="#94a3b8" font-size="18">🌐  EN · RU · RO</text>
</svg>
