<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Film strip body -->
  <rect x="2" y="8" width="28" height="16" rx="2" fill="#1e293b"/>

  <!-- Top sprocket holes -->
  <rect x="4"  y="10" width="4" height="3" rx="1" fill="#0f172a"/>
  <rect x="10" y="10" width="4" height="3" rx="1" fill="#0f172a"/>
  <rect x="18" y="10" width="4" height="3" rx="1" fill="#0f172a"/>
  <rect x="24" y="10" width="4" height="3" rx="1" fill="#0f172a"/>

  <!-- Bottom sprocket holes -->
  <rect x="4"  y="19" width="4" height="3" rx="1" fill="#0f172a"/>
  <rect x="10" y="19" width="4" height="3" rx="1" fill="#0f172a"/>
  <rect x="18" y="19" width="4" height="3" rx="1" fill="#0f172a"/>
  <rect x="24" y="19" width="4" height="3" rx="1" fill="#0f172a"/>

  <!-- Dividers between frames -->
  <rect x="9"  y="14" width="1" height="4" fill="#0f172a"/>
  <rect x="17" y="14" width="1" height="4" fill="#0f172a"/>
  <rect x="23" y="14" width="1" height="4" fill="#0f172a"/>

  <!-- Side frames (dark) -->
  <rect x="3"  y="14" width="6" height="4" fill="#374151"/>
  <rect x="24" y="14" width="5" height="4" fill="#374151"/>

  <!-- Center frame (red — the "hero" frame) -->
  <rect x="10" y="14" width="12" height="4" fill="#dc2626"/>
</svg>
